name: Build SkellyTune Realtime VST3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch/event; preserve latest evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Realtime-only JUCE VST3
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DSKELLY_BUILD_PLUGIN=ON -DSKELLY_BUILD_DSP_TESTS=OFF
          -DSKELLY_BUILD_STUDIO=OFF -DSKELLY_BUILD_STUDIO_FAST=OFF
          -DSKELLY_BUILD_GUI_SMOKE=ON
      - name: Build SkellyTune Realtime VST3
        run: cmake --build build --config Release --target SkellyTuneRealtime_VST3 --parallel 2
      - name: Build and run editor startup smoke test
        shell: pwsh
        run: |
          cmake --build build --config Release --target SkellyTuneGuiSmoke --parallel 2
          $exe = Get-ChildItem -Path build -File -Recurse -Filter 'SkellyTuneGuiSmoke.exe' | Select-Object -First 1
          if (-not $exe) { throw 'GUI smoke test executable missing' }
          $hubScript = Get-ChildItem -Path build/_deps -Recurse -File -Filter skellworld_hub.py | Select-Object -First 1
          if (-not $hubScript) { throw 'Pinned SkellCore localhost hub not found' }
          $stdout = Join-Path $PWD 'skellworld-hub-out.log'
          $stderr = Join-Path $PWD 'skellworld-hub-err.log'
          $hub = Start-Process -FilePath python -ArgumentList @('-u', ('"' + $hubScript.FullName + '"')) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Start-Sleep -Milliseconds 700
            if ($hub.HasExited) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw 'Local SkellWorld Hub could not start'
            }
            $env:SKELL_SYNC_HUB_TEST = '1'
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "GUI + SkellKey integration smoke failed: $LASTEXITCODE"
            }
          } finally {
            Remove-Item Env:SKELL_SYNC_HUB_TEST -ErrorAction SilentlyContinue
            if (-not $hub.HasExited) { Stop-Process -Id $hub.Id -Force }
          }
      - name: Save verified Mini UI previews
        uses: actions/upload-artifact@v6
        with:
          name: SkellyTuneMini-UI-Previews
          path: SkellyTuneMini_UI_*.png
          retention-days: 7
          if-no-files-found: error
      - name: Package only SkellyTune Realtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundles = @(Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' |
            Where-Object { $_.Name -eq 'SkellyTune Realtime.vst3' -and $_.FullName -match '[\\/]Release[\\/]' })
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one SkellyTune Realtime Release VST3 bundle; found $($bundles.Count)"
          }
          Compress-Archive -LiteralPath $bundles[0].FullName -DestinationPath dist/SkellyTune-Realtime-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 7
          name: SkellyTune-Realtime-Windows-VST3
          path: dist/SkellyTune-Realtime-Windows-VST3.zip
          if-no-files-found: error
