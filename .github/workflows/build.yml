name: Build SkellyTune Realtime VST3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch/event; preserve latest evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Realtime-only JUCE VST3
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DSKELLY_BUILD_PLUGIN=ON -DSKELLY_BUILD_DSP_TESTS=OFF
          -DSKELLY_BUILD_STUDIO=OFF -DSKELLY_BUILD_STUDIO_FAST=OFF
          -DSKELLY_BUILD_GUI_SMOKE=ON
      - name: Build SkellyTune Realtime VST3
        run: cmake --build build --config Release --target SkellyTuneRealtime_VST3 --parallel 2
      - name: Build and run editor startup smoke test
        shell: pwsh
        run: |
          cmake --build build --config Release --target SkellyTuneGuiSmoke --parallel 2
          $exe = Get-ChildItem -Path build -File -Recurse -Filter 'SkellyTuneGuiSmoke.exe' | Select-Object -First 1
          if (-not $exe) { throw 'GUI smoke test executable missing' }
          # A real SkellKey sender and Mini receiver share Key/Scale/A4
          # through a Windows Local\\ mapping. NO Python or Hub is started.
          $env:SKELL_LOCAL_IPC_TEST = '1'
          try {
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Hubless SkellKey/Mini integration smoke failed: $LASTEXITCODE"
            }
          } finally {
            Remove-Item Env:SKELL_LOCAL_IPC_TEST -ErrorAction SilentlyContinue
          }
      - name: Package only SkellyTune Realtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundles = @(Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' |
            Where-Object { $_.Name -eq 'SkellyTune Realtime.vst3' -and $_.FullName -match '[\\/]Release[\\/]' })
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one SkellyTune Realtime Release VST3 bundle; found $($bundles.Count)"
          }
          $modules = @(Get-ChildItem -LiteralPath $bundles[0].FullName -Recurse -File -Filter '*.vst3')
          if ($modules.Count -ne 1) {
            throw "Expected exactly one VST3 module in bundle; found $($modules.Count)"
          }
          # Compare path components through .NET path APIs instead of a
          # hand-escaped suffix. PowerShell single-quoted strings preserve
          # backslashes, so a doubled literal separator rejects valid bundles.
          $expectedRelativePath = [System.IO.Path]::Combine('Contents', 'x86_64-win', 'SkellyTune Realtime.vst3')
          function Test-ExpectedVst3ModulePath([string]$BundlePath, [string]$ModulePath) {
            $relativePath = [System.IO.Path]::GetRelativePath($BundlePath, $ModulePath)
            return [String]::Equals($relativePath, $expectedRelativePath, [StringComparison]::OrdinalIgnoreCase)
          }

          # Regression probes: accept the exact Windows VST3 layout and reject
          # wrong architecture/module paths before inspecting the real bundle.
          $probeRoot = Join-Path $env:RUNNER_TEMP 'SkellyTuneVst3PathRegression'
          $validProbe = [System.IO.Path]::Combine($probeRoot, 'Contents', 'x86_64-win', 'SkellyTune Realtime.vst3')
          $wrongArchProbe = [System.IO.Path]::Combine($probeRoot, 'Contents', 'x86_64-linux', 'SkellyTune Realtime.vst3')
          $wrongModuleProbe = [System.IO.Path]::Combine($probeRoot, 'Contents', 'x86_64-win', 'OtherPlugin.vst3')
          if (-not (Test-ExpectedVst3ModulePath $probeRoot $validProbe)) {
            throw 'VST3 path regression: valid Windows module path was rejected'
          }
          if ((Test-ExpectedVst3ModulePath $probeRoot $wrongArchProbe) -or
              (Test-ExpectedVst3ModulePath $probeRoot $wrongModuleProbe)) {
            throw 'VST3 path regression: invalid module path was accepted'
          }

          if (-not (Test-ExpectedVst3ModulePath $bundles[0].FullName $modules[0].FullName)) {
            $relativeActualPath = [System.IO.Path]::GetRelativePath($bundles[0].FullName, $modules[0].FullName)
            throw "Unexpected VST3 module location: $relativeActualPath"
          }
          $bytes = [System.IO.File]::ReadAllBytes($modules[0].FullName)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'Missing Windows MZ header'
          }
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($pe -lt 64 -or $pe + 26 -gt $bytes.Length) { throw 'Invalid PE offset' }
          if ($bytes[$pe] -ne 0x50 -or $bytes[$pe+1] -ne 0x45 -or
              $bytes[$pe+2] -ne 0 -or $bytes[$pe+3] -ne 0 -or
              [BitConverter]::ToUInt16($bytes, $pe+4) -ne 0x8664 -or
              [BitConverter]::ToUInt16($bytes, $pe+24) -ne 0x20b) {
            throw 'Not an AMD64 PE32+ module'
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $modules[0].FullName | Format-List
          Compress-Archive -LiteralPath $bundles[0].FullName -DestinationPath dist/SkellyTune-Realtime-Windows-VST3.zip -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath dist/SkellyTune-Realtime-Windows-VST3.zip | Format-List
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 7
          name: SkellyTune-Realtime-Windows-VST3
          path: dist/SkellyTune-Realtime-Windows-VST3.zip
          if-no-files-found: error
