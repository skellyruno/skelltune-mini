name: Verify portable DSP
on:
  push:
    paths:
      - 'dsp/**'
      - 'Source/**'
      - 'tests/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/verify-dsp.yml'
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/event; preserve latest evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure portable DSP (no JUCE required)
        run: cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release -DSKELLY_BUILD_PLUGIN=OFF -DSKELLY_BUILD_DSP_TESTS=ON
      - name: Compile portable DSP targets
        run: cmake --build build-dsp --parallel 4
      - name: Run DSP regressions
        run: ctest --test-dir build-dsp --output-on-failure --parallel 4
      - name: Measure loud vowel gain consistency and subsonic response
        run: |
          ./build-dsp/dsp_v37_wet_rumble
          ./build-dsp/dsp_v38_loud_voice
      - name: Measure callback CPU distribution (diagnostic)
        run: ./build-dsp/profile_callbacks
      - name: Render saved real singer input in G major / zero-ms retune
        run: |
          SKELLY_TRACE=build-dsp/quiet_trace.csv ./build-dsp/skelly_render benchmark/v33/raw_levelmatched_20-28.wav build-dsp/real_vocal_current.wav 0 100 100 0 0 2773
          python3 tests/validate_real_vocal.py benchmark/v33/raw_levelmatched_20-28.wav build-dsp/real_vocal_current.wav
          python3 tests/validate_real_vocal.py --scale benchmark/v33/raw_levelmatched_20-28.wav build-dsp/loud_vocal_input.wav 1.08
          SKELLY_TRACE=build-dsp/louder_trace.csv ./build-dsp/skelly_render build-dsp/loud_vocal_input.wav build-dsp/loud_vocal_render.wav 0 100 100 0 0 2773
          python3 tests/validate_real_vocal.py --report build-dsp/real_vocal_current.wav build-dsp/loud_vocal_render.wav 1.08
          python3 tests/validate_real_vocal.py --traces build-dsp/quiet_trace.csv build-dsp/louder_trace.csv
          SKELLY_V33_ONSET_MEMORY_OFF=1 ./build-dsp/skelly_render benchmark/v33/raw_levelmatched_20-28.wav build-dsp/raw_no_onset.wav 0 100 100 0 0 2773
          SKELLY_V33_ONSET_MEMORY_OFF=1 ./build-dsp/skelly_render build-dsp/loud_vocal_input.wav build-dsp/loud_no_onset.wav 0 100 100 0 0 2773
          python3 tests/validate_real_vocal.py --report build-dsp/raw_no_onset.wav build-dsp/loud_no_onset.wav 1.08
          SKELLY_V31_BRIDGE_OFF=1 ./build-dsp/skelly_render benchmark/v33/raw_levelmatched_20-28.wav build-dsp/raw_no_bridge.wav 0 100 100 0 0 2773
          SKELLY_V31_BRIDGE_OFF=1 ./build-dsp/skelly_render build-dsp/loud_vocal_input.wav build-dsp/loud_no_bridge.wav 0 100 100 0 0 2773
          python3 tests/validate_real_vocal.py --report build-dsp/raw_no_bridge.wav build-dsp/loud_no_bridge.wav 1.08
          python3 tests/validate_real_vocal.py --compare build-dsp/real_vocal_current.wav build-dsp/loud_vocal_render.wav 1.08
